name: Build Resumes
on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            Anthony_Ge_Resume_SWE.tex
            Anthony_Ge_Resume_QuantTrading.tex
          latexmk_use_xelatex: true

      - name: Update compiled PDFs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Anthony_Ge_Resume_SWE.pdf Anthony_Ge_Resume_QuantTrading.pdf
          git commit -m "Automated build: update resume PDFs" || echo "No changes to commit"
          git push
